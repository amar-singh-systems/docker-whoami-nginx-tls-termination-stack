services:
  whoami:
    container_name: whoami
    image: traefik/whoami
    command:
     # Non essential flavor text for the webapp itself
     - --name=whoareyou
    networks: 
      - 'webnet'
  nginx:
    container_name: nginx
    image: nginx
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf
    - ./secrets/site.key:/etc/nginx/site.key
    - ./secrets/site.crt:/etc/nginx/site.crt
    ports:
    - '6767:443'
    networks: 
      - 'webnet'
networks:
  webnet:
    name: 'webnet'
